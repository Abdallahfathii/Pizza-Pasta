
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<div style="display:flex;flex-direction:column;align-items:center;padding:32px;gap:24px;">

  <div style="position:relative;width:260px;height:260px;">
    <!-- Italian flag border frame -->
    <div style="position:absolute;inset:0;border-radius:12px;overflow:hidden;z-index:0;">
      <div style="display:flex;width:100%;height:100%;">
        <div style="flex:1;background:#009246;"></div>
        <div style="flex:1;background:#ffffff;border-left:1px solid #eee;border-right:1px solid #eee;"></div>
        <div style="flex:1;background:#ce2b37;"></div>
      </div>
    </div>

    <!-- White QR container -->
    <div style="position:absolute;inset:10px;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center;z-index:1;">
      <div id="qrcode"></div>
    </div>

    <!-- Corner flags -->
    <div style="position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;overflow:hidden;border:2px solid #d4af37;z-index:2;display:flex;">
      <div style="flex:1;background:#009246;"></div>
      <div style="flex:1;background:#fff;"></div>
      <div style="flex:1;background:#ce2b37;"></div>
    </div>
    <div style="position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;overflow:hidden;border:2px solid #d4af37;z-index:2;display:flex;">
      <div style="flex:1;background:#009246;"></div>
      <div style="flex:1;background:#fff;"></div>
      <div style="flex:1;background:#ce2b37;"></div>
    </div>
    <div style="position:absolute;bottom:-8px;left:-8px;width:28px;height:28px;border-radius:50%;overflow:hidden;border:2px solid #d4af37;z-index:2;display:flex;">
      <div style="flex:1;background:#009246;"></div>
      <div style="flex:1;background:#fff;"></div>
      <div style="flex:1;background:#ce2b37;"></div>
    </div>
    <div style="position:absolute;bottom:-8px;right:-8px;width:28px;height:28px;border-radius:50%;overflow:hidden;border:2px solid #d4af37;z-index:2;display:flex;">
      <div style="flex:1;background:#009246;"></div>
      <div style="flex:1;background:#fff;"></div>
      <div style="flex:1;background:#ce2b37;"></div>
    </div>
  </div>

  <!-- Label -->
  <div style="text-align:center;">
    <div style="font-size:18px;font-weight:500;color:var(--color-text-primary);letter-spacing:1px;">P&P Pizza and Pasta</div>
    <div style="font-size:13px;color:var(--color-text-secondary);margin-top:4px;">امسح لعرض المنيو</div>
    <!-- Italian flag strip -->
    <div style="display:flex;justify-content:center;gap:0;margin-top:10px;border-radius:4px;overflow:hidden;width:120px;margin-inline:auto;">
      <div style="flex:1;height:5px;background:#009246;"></div>
      <div style="flex:1;height:5px;background:#ffffff;border-top:1px solid #ddd;border-bottom:1px solid #ddd;"></div>
      <div style="flex:1;height:5px;background:#ce2b37;"></div>
    </div>
  </div>

  <!-- Download button -->
  
</div>

<script>
new QRCode(document.getElementById("qrcode"), {
  text: "https://menupizzaandpasta.netlify.app/",
  width: 200,
  height: 200,
  colorDark: "#000000",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});

document.getElementById("downloadBtn").addEventListener("click", function() {
  setTimeout(() => {
    const canvas = document.querySelector("#qrcode canvas");
    if (canvas) {
      const link = document.createElement("a");
      link.download = "pp-menu-qrcode.png";
      link.href = canvas.toDataURL();
      link.click();
    }
  }, 200);
});
</script>
